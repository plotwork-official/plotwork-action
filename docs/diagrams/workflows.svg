<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 740" width="579" height="740" role="img" aria-labelledby="dg-title dg-desc" aria-description="ci: 7 nodes, 6 connections. 6 jobs of the ci workflow, started by a push to main, next or a pull request or a manual run, in the order their needs set, imported from GitHub Actions." style="max-width:100%;height:auto" font-family="pw-sans-2b3vdleeixl, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="auto"><title id="dg-title">ci</title><desc id="dg-desc">ci: 7 nodes, 6 connections. 6 jobs of the ci workflow, started by a push to main, next or a pull request or a manual run, in the order their needs set, imported from GitHub Actions.
Nodes:
- Push or pull request or manual run, terminal
- dist matches its checksums (ubuntu-latest, 4 steps), step
- check (ubuntu-latest, 12 steps), step
- sync (ubuntu-latest, 4 steps), step
- validate (ubuntu-latest, 4 steps), step
- render (ubuntu-latest, 5 steps), step
- inputs (ubuntu-latest, 4 steps), step
Connections:
- Push or pull request or manual run to dist matches its checksums
- Push or pull request or manual run to check
- Push or pull request or manual run to sync
- Push or pull request or manual run to validate
- Push or pull request or manual run to render
- Push or pull request or manual run to inputs</desc><style>.dg-s0{fill:#ffffff;filter:url(#dg-lift)}.dg-s1{fill:#171716}.dg-s2{fill:#ffffff;stroke:#dad9d2;filter:url(#dg-lift)}.dg-s3{fill:#52514e}.dg-s4{fill:#ffffff;stroke:#dad9d2}.dg-s5{fill:#ffffff}@media (prefers-color-scheme:dark){svg:not([data-scheme="light"]) .dg-s0{fill:#1f1f1d;filter:url(#dg-lift-dark)}svg:not([data-scheme="light"]) .dg-s1{fill:#f3f2ee}svg:not([data-scheme="light"]) .dg-s2{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg:not([data-scheme="light"]) .dg-s3{fill:#c3c2b7}svg:not([data-scheme="light"]) .dg-s4{fill:#1f1f1d;stroke:#3a3a37}svg:not([data-scheme="light"]) .dg-s5{fill:#1f1f1d}}svg[data-scheme="dark"] .dg-s0{fill:#1f1f1d;filter:url(#dg-lift-dark)}svg[data-scheme="dark"] .dg-s1{fill:#f3f2ee}svg[data-scheme="dark"] .dg-s2{fill:#1f1f1d;stroke:#3a3a37;filter:url(#dg-lift-dark)}svg[data-scheme="dark"] .dg-s3{fill:#c3c2b7}svg[data-scheme="dark"] .dg-s4{fill:#1f1f1d;stroke:#3a3a37}svg[data-scheme="dark"] .dg-s5{fill:#1f1f1d}</style><metadata data-format="buun-diagram"># Generated by plotwork generate from the source workflows (github-actions: .github/workflows/*.yml, .github/workflows/*.yaml).
# The next run writes over this file. Put changes in docs/diagrams/workflows.overrides.json, or run plotwork generate --capture
# after an edit to keep it there, then run plotwork generate.
flow "ci" direction=right desc="6 jobs of the ci workflow, started by a push to main, next or a pull request or a manual run, in the order their needs set, imported from GitHub Actions."

node on terminal "Push or pull request or manual run"
node dist step "dist matches its checksums" sub="ubuntu-latest, 4 steps"
node check step "check" sub="ubuntu-latest, 12 steps"
node sync step "sync" sub="ubuntu-latest, 4 steps"
node validate step "validate" sub="ubuntu-latest, 4 steps"
node render step "render" sub="ubuntu-latest, 5 steps"
node inputs step "inputs" sub="ubuntu-latest, 4 steps"

on -&gt; dist
on -&gt; check
on -&gt; sync
on -&gt; validate
on -&gt; render
on -&gt; inputs
