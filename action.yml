# Written by the Plotwork monorepo build (pnpm action:build) from apps/action/src/metadata.ts. Do not edit by hand.
name: 'Plotwork diagrams'
description: 'Check, sync, validate, render, and generate Plotwork diagrams from your files. Offline by default, with no telemetry.'
author: 'Buun Group'
branding:
  icon: 'layout'
  color: 'blue'

inputs:
  command:
    description: 'What to do. check fails when a picture is stale or a diagram has an error, and writes nothing. sync redraws the stale pictures in the workspace and commits nothing. validate reports errors and warnings without drawing pictures into files. render draws each .diagram file to a light and a dark SVG in out-dir. generate makes each diagram the sources of the settings file name from its files (Terraform, OpenAPI, Compose, Kubernetes, schemas, workflows, data) and, with mode, reports or writes the ones that drifted.'
    required: false
    default: 'check'
  paths:
    description: 'Markdown files to check, sync, or validate: one glob, file, or folder per line, relative to working-directory. A line that starts with ! leaves out what it matches. node_modules and .git are never searched.'
    required: false
    default: '**/*.md'
  diagrams:
    description: 'Standalone .diagram files: one glob, file, or folder per line. check and validate report their errors, render draws them, and sync leaves them alone. Empty means none.'
    required: false
    default: '**/*.diagram'
  out-dir:
    description: 'The folder render writes SVG files to, relative to working-directory. Each file keeps its folder: docs/flow.diagram becomes <out-dir>/docs/flow.svg and flow.dark.svg.'
    required: false
    default: 'plotwork-svg'
  fail-on:
    description: 'Which problems fail the step. error: errors, and stale pictures in check. warning: warnings as well. never: report only. Problems are annotated either way.'
    required: false
    default: 'error'
  convert-mermaid:
    description: 'When true, check and sync treat each mermaid fence that converts to Plotwork as a diagram: check reports it, and sync replaces it with a diagram fence and draws it.'
    required: false
    default: 'false'
  config:
    description: 'The repository settings: a JSON file relative to working-directory whose defaults every command applies to the headers and whose rules check and validate apply. Empty looks for plotwork.config.json, then .plotwork/config.json, in working-directory and each folder above it up to the repository root, and applies none when there is none. One file per run: a settings file in a subfolder is not read. off applies none.'
    required: false
    default: ''
  rules-org:
    description: 'An organisation id or slug whose saved style rules check and validate apply instead of the rules of the settings file, read from the Plotwork API with the organisation key in the PLOTWORK_API_KEY environment variable, or, with no key and permissions: id-token: write, as a trusted publisher of the organisation. The settings file''s defaults still apply. The only network request the action makes, and only when set.'
    required: false
    default: ''
  mode:
    description: 'generate only. check fails when a diagram no longer matches its files, says what changed, and writes nothing. write makes the diagrams again and does what on-drift says with them.'
    required: false
    default: 'check'
  on-drift:
    description: 'generate in write mode only. pr pushes the new diagrams to pr-branch and opens or updates one pull request (needs contents: write and pull-requests: write). commit commits them to the branch the run is on (needs contents: write), and does nothing when the commit that started the run is its own. fail only fails, leaving the files in the workspace.'
    required: false
    default: 'pr'
  pr-branch:
    description: 'generate with on-drift pr: the branch the new diagrams are pushed to. The action owns it: each run replaces it with one commit on top of the branch the run is on.'
    required: false
    default: 'plotwork/diagrams'
  pr-title:
    description: 'generate with on-drift pr: the title of the pull request.'
    required: false
    default: 'docs: regenerate diagrams from their sources'
  commit-message:
    description: 'generate in write mode: the message of the commit. The action adds the trailer Plotwork-Generated: true, by which it knows its own commits.'
    required: false
    default: 'docs: regenerate diagrams from their sources'
  publish:
    description: 'generate in write mode: when true, publish each source that has a publish section to Plotwork with the key in the PLOTWORK_API_KEY environment variable: a stable link for a personal key, or the organisation library. With no key and permissions: id-token: write, it signs in as a trusted publisher of the organisation and publishes to its library. Without either it is skipped with a notice. Only the generated diagram source is sent, never the files it was made from.'
    required: false
    default: 'false'
  github-token:
    description: 'generate in write mode: the token that pushes and opens the pull request. A pull request opened with the default token starts no workflow; pass a GitHub App or personal token to run checks on it.'
    required: false
    default: '${{ github.token }}'
  since:
    description: 'generate only. A git ref, such as origin/main or the base commit of the pull request (github.event.pull_request.base.sha): only the sources whose files, overrides, or diagram changed since it run, and every source when the settings file changed. Needs the history: check out with fetch-depth: 0. Empty runs every source; keep a nightly run without it, since a new engine can redraw pictures no file change points at.'
    required: false
    default: ''
  sarif-file:
    description: 'generate only. A file to write a SARIF report to, for github/codeql-action/upload-sarif: each drifted diagram and each problem as a code scanning alert on its line. Empty writes none.'
    required: false
    default: ''
  junit-file:
    description: 'generate only. A file to write a JUnit XML report to, one test case for each source, for a test view. Empty writes none.'
    required: false
    default: ''
  report-file:
    description: 'generate only. A file to write the versioned JSON report to (schema https://docs.plotwork.dev/schemas/plotwork.report.json, schemaVersion 1): the run, and per source its files, status, changes by meaning, counts, problems, and CODEOWNERS owners. Empty writes none.'
    required: false
    default: ''
  comment:
    description: 'generate only, on pull_request runs. auto writes one comment on the pull request when a diagram drifted or has an error, with the change table, the pictures before and after, the owners, and how to fix it, and edits that same comment on later runs, to say so when everything is in step again. always writes it on every run. never writes none. Needs pull-requests: write; when the token cannot comment, as on a pull request from a fork, the run says so in a notice and the job summary has everything.'
    required: false
    default: 'auto'
  mention-owners:
    description: 'generate only. When true, the pull request comment names the CODEOWNERS owners of each drifted diagram as @-mentions, which notifies them. False names them without notifying anyone.'
    required: false
    default: 'false'
  report-drift:
    description: 'generate only. When true, send the run''s metadata (the repository, the ref and commit, and per source its name, out path, status, change counts, and owners; never a diagram or a file) to the organisation''s drift dashboard on Plotwork, with the organisation key in the PLOTWORK_API_KEY environment variable, or, with no key and permissions: id-token: write, as a trusted publisher of the organisation. The organisation is rules-org, else brand.organization of the settings, else the key''s own. Pro. A refusal is a notice and fails nothing.'
    required: false
    default: 'false'
  summary:
    description: 'When true, write a job summary: a table of files, their status, and how to fix each problem.'
    required: false
    default: 'true'
  working-directory:
    description: 'The folder to run in, relative to the repository root. paths, diagrams, and out-dir are relative to it. Annotations and the files output name paths from the repository root.'
    required: false
    default: '.'

outputs:
  stale:
    description: 'The number of diagrams whose picture was missing or out of date: found by check, redrawn by sync, drifted from their files in generate. 0 for validate and render.'
  errors:
    description: 'The number of errors found.'
  warnings:
    description: 'The number of warnings found.'
  files:
    description: 'A JSON array of paths from the repository root. check: the Markdown files that need a sync. sync: the files it wrote, and the dark pictures Plotwork drew before that it removed once one SVG holds both schemes. render: the SVG files it wrote. validate: the files with an error. generate: the diagrams that drifted in check mode, the files it wrote or removed in write mode.'
  changes:
    description: 'generate: a JSON array with one entry per diagram that drifted: its source name, its out file, the number of changes by meaning, and one sentence naming them, such as Added 1 node (logs).'
  pull-request:
    description: 'generate with on-drift pr: the address of the pull request it opened or updated, or empty. When nothing drifted, the pull request it opened before is closed with its branch, and this is empty.'
  published:
    description: 'generate with publish: a JSON array of what was published, each with its source name and link (and stable link, for an alias).'
  comment-url:
    description: 'generate on a pull request: the address of the comment it wrote or edited, or empty.'

runs:
  using: 'node24'
  main: 'dist/index.js'
