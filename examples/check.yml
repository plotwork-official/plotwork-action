# Fails a pull request whose diagram pictures are stale or whose diagrams have errors.
# Copy to .github/workflows/plotwork-check.yml.
name: plotwork-check

on:
  pull_request:
    paths: ['**/*.md', '**/*.diagram']

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: plotwork-official/plotwork-action@v1
        with:
          paths: |
            README.md
            docs/**/*.md
