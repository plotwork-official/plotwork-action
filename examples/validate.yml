# Reports every error and warning in diagrams without checking the pictures, and fails on warnings too.
# Copy to .github/workflows/plotwork-validate.yml.
name: plotwork-validate

on:
  pull_request:
    paths: ['**/*.md', '**/*.diagram']

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: plotwork-official/plotwork-action@v1
        with:
          command: validate
          diagrams: diagrams/**/*.diagram
          fail-on: warning
