# Redraws stale pictures on main and opens a pull request with the result. The Plotwork step writes files and commits
# nothing; peter-evans/create-pull-request commits them on a branch and opens the pull request.
# Copy to .github/workflows/plotwork-sync.yml. Under Settings, Actions, General, allow GitHub Actions to create pull requests.
name: plotwork-sync

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotwork-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plotwork
        uses: plotwork-official/plotwork-action@v1
        with:
          command: sync
          paths: docs/**/*.md
      - if: steps.plotwork.outputs.stale != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: plotwork/sync
          commit-message: 'docs: redraw stale diagrams'
          title: 'docs: redraw stale diagrams'
          body: Redrawn by the plotwork-sync workflow.
          add-paths: docs/**
