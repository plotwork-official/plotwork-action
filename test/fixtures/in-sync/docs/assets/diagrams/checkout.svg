<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 873 276" width="873" height="276" role="img" aria-labelledby="checkout-title checkout-desc" aria-description="Checkout: 3 nodes, 2 connections." style="max-width:100%;height:auto" font-family="pw-sans-8t8mjx3s4i, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="auto"><title id="checkout-title">Checkout</title><desc id="checkout-desc">Checkout: 3 nodes, 2 connections.
