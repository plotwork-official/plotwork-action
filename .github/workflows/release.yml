# Runs when a release vX.Y.Z or vX.Y.Z-beta.N is published. Written by the Plotwork monorepo build from
# .github/action-public/; an edit made here is replaced by the next build.
#
#   job          what it does                                                   permissions
#   provenance   every release: checks the tag, the checksums and the banner,   contents read, id-token write,
#                then signs a build provenance attestation for dist/index.js,   attestations write
#                dist/checksums.txt and each shard of icon art in dist/icons/,
#                stored in this repository
#   major-tag    a stable release only, once provenance passed: moves the       contents write
#                major tag vX to the release's commit
#
# The bundle is built in the private Plotwork monorepo, which commits it here with the GitHub App. The attestation is
# signed here, by this workflow, so it is recorded in the public Sigstore transparency log under this repository's name,
# and anyone can check the file a workflow runs:
#
#   gh attestation verify dist/index.js --repo plotwork-official/plotwork-action
#
# The release tag itself is never moved or rewritten. This workflow is the only thing that moves a major tag: the
# monorepo's release workflow creates the release with a GitHub App token, which starts this run, and never touches vX.
name: release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  provenance:
    name: sign the bundle's provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Nothing is signed unless the files are the ones the build wrote for this version.
      - name: Check the tag, the checksums and the banner
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error title=Provenance::The tag $TAG is not a version, so nothing is signed."
            exit 1
          fi
          (cd dist && sha256sum --check --strict checksums.txt)
          if ! head -c 200 dist/index.js | grep -qF "plotwork-official/plotwork-action ${TAG#v}."; then
            echo "::error title=Provenance::dist/index.js does not name version ${TAG#v} in its banner, so nothing is signed."
            exit 1
          fi

      # The bundle reads the icon art outside its core from dist/icons/, so each shard is signed beside it.
      - name: Sign the provenance of the bundle, its checksums and its icon art
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/index.js
            dist/checksums.txt
            dist/icons/*/*.json

  major-tag:
    name: move the major tag
    needs: provenance
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Check the tag and the bundle
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Release::The tag $TAG is not vMAJOR.MINOR.PATCH, so no major tag is moved."
            exit 1
          fi
          # A stable release is made from main, so vX never points at a commit only next has.
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "::error title=Release::$TAG is not on main, so no major tag is moved."
            exit 1
          fi
          (cd dist && sha256sum --check --strict checksums.txt)
          echo "major=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Move the major tag
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git tag --force "$MAJOR" "$TAG^{commit}"
          git push --force origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $TAG ($(git rev-parse "$TAG^{commit}"))." >> "$GITHUB_STEP_SUMMARY"
